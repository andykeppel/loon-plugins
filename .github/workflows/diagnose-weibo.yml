name: Validate Loon plugin mirror

on:
  push:
    paths:
      - '.github/workflows/diagnose-weibo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: node --check tools/sync.mjs && node --check scripts/weibo_json.js && node --check tools/verify.mjs
      - name: Verify plugin headers and Weibo settings
        run: node tools/verify.mjs
      - name: Install conversion dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Test conversion from live upstream sources
        env:
          GITHUB_REPOSITORY: andykeppel/loon-plugins
          FORCE_SYNC: 'true'
        run: node tools/sync.mjs
      - name: Verify generated plugins and settings
        run: node tools/verify.mjs
      - name: Ensure generated plugins match published ones
        run: git diff --exit-code -- YangJiBao.plugin WeiboEnhanced.plugin scripts/weibo_json.js
