name: Diagnose Weibo settings script

on:
  push:
    paths:
      - '.github/workflows/diagnose-weibo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch original and maintained Weibo scripts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 40 -A 'Surge'             https://ddgksf2013.top/scripts/weibo_json.js -o /tmp/original.js
          curl --fail --location --silent --show-error --retry 3 --max-time 40             https://raw.githubusercontent.com/ifflagged/Romeo/main/Modules/JavaScript/ddgksf2013/WeiboEnhanced/ddgksf2013_weibo_json.js -o /tmp/maintained.js
          wc -c /tmp/original.js /tmp/maintained.js
          sha256sum /tmp/original.js /tmp/maintained.js
          node --check /tmp/original.js
          node --check /tmp/maintained.js

      - name: Test whether each original-script entry can serve the settings page
        shell: bash
        run: |
          cat > /tmp/diagnose.cjs <<'NODE'
          const fs=require('fs'),vm=require('vm');
          for (const [name,path] of [['original','/tmp/original.js'],['maintained','/tmp/maintained.js']]){
            for (const variant of ['qx','loon','loon-no-store','surge']){
              const source=fs.readFileSync(path,'utf8');
              const sandbox={module:{exports:{}},console:{log:()=>{},warn:()=>{},error:()=>{}},setTimeout,clearTimeout,URL,URLSearchParams,TextEncoder,TextDecoder,
                $request:{url:'https://api.weibo.cn/__qx_weibo_settings__/',method:'GET',headers:{}},
                $done:(v)=>{sandbox._output=v;}
              };
              if (variant==='qx'){ sandbox.$prefs={valueForKey:()=>null,setValueForKey:()=>{}}; sandbox.$task={}; }
              if (variant.startsWith('loon')){sandbox.$loon={};if(variant==='loon')sandbox.$persistentStore={read:()=>null,write:()=>true};}
              if (variant==='surge'){sandbox.$persistentStore={read:()=>null,write:()=>true};sandbox.$environment={surge:{}};}
              try{vm.runInNewContext(source,sandbox,{timeout:8000});}
              catch(e){console.log(name,variant,'script-execution-error',e.message);}
              const output=sandbox._output||{};
              console.log(name,variant,JSON.stringify({settingsURL:sandbox.module.exports?.SETTINGS_URL||null, outputKeys:Object.keys(output), status:output.status,
                  responseStatus:output.response?.status, responseKeys:Object.keys(output.response||{}),
                  returnedHtml:(output.response?.body||output.body||'').includes('<html'),outputStart:(output.response?.body||output.body||'').slice(0,60)}));
            }
          }
          NODE
          node /tmp/diagnose.cjs
