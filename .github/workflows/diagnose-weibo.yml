name: Validate Loon plugins and Weibo settings

on:
  push:
    paths:
      - '.github/workflows/diagnose-weibo.yml'
      - 'tools/sync.mjs'
      - 'YangJiBao.plugin'
      - 'WeiboEnhanced.plugin'
      - 'scripts/weibo_json.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify JavaScript syntax
        run: |
          node --check tools/sync.mjs
          node --check scripts/weibo_json.js
      - name: Verify Loon plugin metadata and Weibo request handler
        run: |
          node <<'NODE'
          const fs=require('node:fs'), vm=require('node:vm');
          const specs=[
            ['YangJiBao.plugin','养基宝去广告','id1597754877'],
            ['WeiboEnhanced.plugin','微博助手功能增强','id350962117'],
          ];
          for(const [path,name,id] of specs){
            const txt=fs.readFileSync(path,'utf8');
            for (const expected of ['#!name='+name, '#!author=ddgksf2013','#!openUrl=https://apps.apple.com/cn/app/'+id,'#!icon=https://raw.githubusercontent.com/andykeppel/loon-plugins/main/icons/']){
              if(!txt.includes(expected))throw new Error(path+' missing: '+expected);
            }
          }
          const weibo=fs.readFileSync('WeiboEnhanced.plugin','utf8');
          const own='script-path=https://raw.githubusercontent.com/andykeppel/loon-plugins/main/scripts/weibo_json.js';
          if(weibo.split(own).length-1<3)throw new Error('Weibo script is not mirrored');
          if(weibo.includes('script-path=https://ddgksf2013.top/'))throw new Error('Weibo still directly loads a third-party runtime');
          const src=fs.readFileSync('scripts/weibo_json.js','utf8');
          let output;
          const sandbox={console:{log(){},warn(){},error(){}},module:{exports:{}},setTimeout,clearTimeout,URL,URLSearchParams,TextEncoder,TextDecoder,
            $loon:{},$persistentStore:{read(){return null},write(){return true}},
            $request:{url:'https://api.weibo.cn/__qx_weibo_settings__/',method:'GET',headers:{}},$done(v){output=v}
          };
          vm.runInNewContext(src,sandbox,{timeout:8000});
          if(output?.response?.status!==200||!output?.response?.body?.includes('<html')){
            throw new Error('Weibo script did not return the settings HTML in Loon mode');
          }
          console.log('PASS: Loon config metadata, synced JS, and assistant settings response');
          NODE
      - name: Validate generation from original sources
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          GITHUB_REPOSITORY=andykeppel/loon-plugins FORCE_SYNC=true node tools/sync.mjs
          node --check scripts/weibo_json.js
          git diff --exit-code -- YangJiBao.plugin WeiboEnhanced.plugin scripts/weibo_json.js
