name: Sync ZenmoFeiShi Meituan plugin

on:
  push:
    paths:
      - '.github/workflows/sync-meituan.yml'
      - 'tools/sync-meituan.mjs'
      - 'tools/verify-meituan.mjs'
  schedule:
    - cron: '53 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Force refresh ZenmoFeiShi sources
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: meituan-plugin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Validate generator syntax
        run: node --check tools/sync-meituan.mjs && node --check tools/verify-meituan.mjs
      - name: Generate ZenmoFeiShi Meituan plugin and official icon
        env:
          GITHUB_REPOSITORY: andykeppel/loon-plugins
          FORCE_SYNC: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force == true) }}
        run: node tools/sync-meituan.mjs
      - name: Validate Loon plugin and JS fixtures
        run: node tools/verify-meituan.mjs
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MeiTuan.plugin scripts/MeiTuan.js icons/MeiTuan.png .last-meituan-sync.json reports/meituan-metadata.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync ZenmoFeiShi Meituan from upstream'
            git push
          fi
