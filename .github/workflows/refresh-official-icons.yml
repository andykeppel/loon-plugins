name: Refresh official App Store icons

on:
  push:
    paths:
      - '.github/workflows/refresh-official-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download official app icons from Apple App Store CDN
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error             --user-agent 'Mozilla/5.0 (compatible; LoonPluginIconUpdater/1.0)'             'https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/6e/53/6d/6e536d6c-faef-abe9-eb2c-ddbc5c7fac14/AppIcon-0-0-1x_U007emarketing-0-6-0-85-220.png/512x512bb.png'             --output icons/YangJiBao.png
          curl --fail --location --retry 3 --silent --show-error             --user-agent 'Mozilla/5.0 (compatible; LoonPluginIconUpdater/1.0)'             'https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/c1/44/f0/c144f0cc-9c49-ea7f-1471-e4db5f80da19/Placeholder.mill/1024x1024wd.png'             --output icons/WeiboEnhanced.png

      - name: Validate downloaded PNG icons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for name in ('YangJiBao.png', 'WeiboEnhanced.png'):
              path = Path('icons') / name
              blob = path.read_bytes()
              if len(blob) < 8000 or blob[:8] != b'\x89PNG\r\n\x1a\n' or blob[12:16] != b'IHDR':
                  raise SystemExit(f'Invalid official PNG: {name}')
              w, h = struct.unpack('>II', blob[16:24])
              if w != h or w < 256:
                  raise SystemExit(f'Unexpected icon size: {name} ({w}x{h})')
              print(f'{name}: {w}x{h}, {len(blob)} bytes')
          PY

      - name: Commit official icons without changing plugins or sync logic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons/YangJiBao.png icons/WeiboEnhanced.png
          if ! git diff --cached --quiet; then
            git commit -m 'fix: replace placeholder icons with official App Store artwork'
            git push
          fi
